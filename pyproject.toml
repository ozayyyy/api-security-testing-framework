[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "apistf"
version = "0.1.0"
description = "Extensible framework for assessing REST APIs: authorisation, authentication and business-logic weaknesses. Rule-based detection only."
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "httpx==0.28.1",
    "pydantic==2.10.4",
    "PyYAML==6.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "anyio==4.7.0",
]

[project.scripts]
apistf = "apistf.cli:main"

[tool.setuptools.packages.find]
include = ["apistf*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
